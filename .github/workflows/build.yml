name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (universal AU + VST3)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          -DSPACES_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --target Spaces_AU Spaces_VST3 SpacesTests

      - name: Offline engine tests
        run: |
          ./build/SpacesTests_artefacts/Release/SpacesTests --quick > tests.log 2>&1 || {
            echo "::error title=tests failed::$(grep -E 'FAIL|passed' tests.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          cat tests.log

      - name: Sign (ad-hoc) and install
        run: |
          set -e
          ART=build/Spaces_artefacts/Release
          codesign --force --deep --sign - "$ART/AU/Spaces.component"
          codesign --force --deep --sign - "$ART/VST3/Spaces.vst3"
          mkdir -p ~/Library/Audio/Plug-Ins/Components ~/Library/Audio/Plug-Ins/VST3
          cp -R "$ART/AU/Spaces.component" ~/Library/Audio/Plug-Ins/Components/
          cp -R "$ART/VST3/Spaces.vst3" ~/Library/Audio/Plug-Ins/VST3/
          killall -9 AudioComponentRegistrar || true

      - name: auval
        run: |
          auval -a | grep -i gily || true
          # On failure, surface the end of the log as an annotation so it can
          # be read from the run summary.
          auval -strict -v aufx Spcs Gily > auval.log 2>&1 || {
            echo "::error title=auval failed::$(grep -n -B6 -A3 -iE 'error|fail|warning' auval.log | head -120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          tail -30 auval.log

      - name: pluginval (VST3 + AU, strictness 10)
        run: |
          set -e
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=./pluginval.app/Contents/MacOS/pluginval
          for plugin in ~/Library/Audio/Plug-Ins/VST3/Spaces.vst3 ~/Library/Audio/Plug-Ins/Components/Spaces.component; do
            $PV --strictness-level 10 --validate-in-process --timeout-ms 900000 "$plugin" > pluginval.log 2>&1 || {
              echo "::error title=pluginval failed ($(basename "$plugin"))::$(tail -80 pluginval.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
              exit 1
            }
          done

      - name: Package
        run: |
          set -e
          mkdir -p dist/Spaces
          cp -R ~/Library/Audio/Plug-Ins/Components/Spaces.component dist/Spaces/
          cp -R ~/Library/Audio/Plug-Ins/VST3/Spaces.vst3 dist/Spaces/
          cp packaging/INSTALL-macOS.txt dist/Spaces/INSTALL.txt
          cd dist && ditto -c -k --keepParent Spaces Spaces-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Spaces-macOS
          path: dist/Spaces-macOS.zip
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/Spaces-macOS.zip --title "Spaces ${GITHUB_REF_NAME}" --generate-notes || gh release upload "${GITHUB_REF_NAME}" dist/Spaces-macOS.zip --clobber

  linux:
    name: Linux (engine tests + pluginval)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libgl-dev xvfb

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSPACES_BUILD_TESTS=ON
          cmake --build build --target Spaces_VST3 SpacesTests

      - name: Offline engine tests (full)
        run: ./build/SpacesTests_artefacts/Release/SpacesTests

      - name: pluginval (VST3, strictness 10)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          sudo apt-get install -y -qq gdb > /dev/null
          # Run under gdb so a crash leaves a backtrace in the run summary.
          xvfb-run -a gdb -q -batch -return-child-result -ex run -ex "thread apply all bt 30" \
            --args ./pluginval --strictness-level 10 --validate-in-process --repeat 3 --randomise --timeout-ms 900000 \
            build/Spaces_artefacts/Release/VST3/Spaces.vst3 > pluginval.log 2>&1 || {
            echo "::error title=pluginval failed::$( (grep -n -m1 -B30 -iE 'SIGSEGV|SIGABRT|FAILED' pluginval.log; grep -A60 -m1 'received signal' pluginval.log) | head -150 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          tail -3 pluginval.log

      - name: UI screenshots
        run: xvfb-run -a ./build/SpacesTests_artefacts/Release/SpacesTests --screenshots screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
